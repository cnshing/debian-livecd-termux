# Compiles packages/ with termux-packages' builder and publishes them as an apt repository
# tarball, which install.sh fetches.
#
#   One or several packages:  Actions > Packages > Run workflow, packages: "nautilus easyeffects"
#                             or: gh workflow run packages.yml -f packages="nautilus easyeffects"
#   Every package:            leave packages empty.
#   Build again anyway:       add rebuild: true, or -f rebuild=true.
#   Draft a release:          push a tag such as v1, or set release: v1 with packages left empty.
#                             A new release starts as a draft; publish it by hand.
#   Pushes and pull requests publish nothing.
#   Which tarballs:           tarballs: net (the default), offline or both. net holds this project's
#                             packages, and install.sh downloads the rest from Termux's mirrors. offline
#                             adds every Termux package the installation can need, which this run's apt
#                             resolves (tools/offline-repo.py), for an install with no network.
#                             A release always includes net, as install.sh downloads it.
#   Which mirror:             mirror: default (packages-cf.termux.dev), fastest, or a mirror of pkg's
#                             list such as mirror.fcix.net (tools/termux-mirror.py). Used for the builder's
#                             dependencies and the offline tarball's Termux packages.
#   Pushes, tags and pull requests take both from the repository variables REPO_TARBALLS and
#   TERMUX_MIRROR when set, under Settings > Secrets and variables > Actions > Variables.
#
# Each dependent set of recipes gets its own job, so unrelated packages build concurrently. A job
# always includes the recipes from this repository that its target depends on, for example
# nautilus brings gnome-autoar. Chromium always has a job of its own, with its libva, because
# it alone takes most of the six hours a job may run. See tools/recipes.py.
#
# A set is built once. Its packages are kept as an artifact named after everything they are built
# from, and any later run that asks for the same set takes them from there instead, whatever else
# that earlier run did. So a set's job depends only on whether that set was built, never on a whole
# run succeeding, and the apt repository is assembled from each set's newest build.
name: Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated package names. Empty builds every package.
        required: false
        default: ""
      release:
        description: Release tag to publish. Needs every package, so leave packages empty.
        required: false
        default: ""
      rebuild:
        description: Build the sets even if an earlier run already built them.
        type: boolean
        default: false
      tarballs:
        description: Apt repository tarballs to make. offline adds every Termux dependency.
        type: choice
        options: [net, offline, both]
        default: net
      mirror:
        description: Termux mirror. default, fastest, or a name from pkg's list such as mirror.fcix.net.
        required: false
        default: default
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["packages/**", "src/**", "tools/recipes.py", "tools/termux-build.json", "tools/make-apt-repo.sh", "tools/offline-repo.py", "tools/termux-mirror.py", "tests/packaging/test-offline-repo.py", "tests/packaging/*nautilus*", "tests/packaging/test-webext.py", ".github/workflows/packages.yml"]
  pull_request:
    paths: ["packages/**", "src/**", "tools/recipes.py", "tools/termux-build.json", "tools/make-apt-repo.sh", "tools/offline-repo.py", "tools/termux-mirror.py", "tests/packaging/test-offline-repo.py", "tests/packaging/*nautilus*", "tests/packaging/test-webext.py", ".github/workflows/packages.yml"]

permissions:
  contents: read

env:
  # The builder revision and matching NDK image are pinned in tools/termux-build.json.
  REPO_TARBALL: livecd-termux-repo-aarch64.tar.gz

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read  # To find the sets earlier runs built.
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
      release: ${{ steps.plan.outputs.release }}
      revision: ${{ steps.config.outputs.revision }}
      image: ${{ steps.config.outputs.image }}
      net: ${{ steps.plan.outputs.net }}
      offline: ${{ steps.plan.outputs.offline }}
      mirror_main: ${{ steps.mirror.outputs.mirror_main }}
      mirror_x11: ${{ steps.mirror.outputs.mirror_x11 }}
    steps:
    - uses: actions/checkout@v7
    - name: Test the AutoEq converter
      run: python3 tests/audio/test-autoeq.py
    - name: Test EasyEffects output recovery
      run: python3 tests/audio/test-bridge.py
    - name: Test the audio signal probe's route isolation
      run: python3 tests/audio/test-verify-signal.py
    - name: Test Bluetooth microphone session cleanup
      run: python3 tests/mic/test-bluetooth.py
    - name: Test packaging and profile integration
      run: python3 tests/packaging/test-packaging.py
    - name: Test packaged browser extensions
      run: python3 tests/packaging/test-webext.py
    - name: Test packaged Firefox video selection and software fallback
      run: python3 tests/packaging/test-firefox-video.py
    - name: Test Nautilus ICU artifact validation
      run: python3 tests/packaging/test-nautilus-artifact.py
    - name: Test the APT guard for a running desktop
      run: python3 tests/packaging/test-apt-session-guard.py
    - name: Test the installer's Android preflight
      run: python3 tests/packaging/test-preflight.py
    - name: Test network discovery integration
      run: python3 tests/packaging/test-network-discovery.py
    - name: Test Android storage mount discovery
      run: python3 tests/native/test-storage-mounts.py
    - name: Test desktop integration startup
      run: python3 tests/native/test-integrations.py
    - name: Test desktop status without a running session
      run: python3 tests/native/test-desktop-status.py
    - name: Test native Turnip and PanVK desktop selection
      run: python3 tests/native/test-graphics.py
    - name: Test the camera supervisor and its desktop wiring
      run: python3 tests/camera/test-camera-controller.py
    - name: Test GNOME wallpaper registration
      run: python3 tests/packaging/test-settings-backgrounds.py
    - name: Test the offline repository's dependency seeds
      run: python3 tests/packaging/test-offline-repo.py
    - name: Read the shared builder pin
      id: config
      run: python3 tools/recipes.py config >> "$GITHUB_OUTPUT"
    - name: Choose the Termux mirror
      id: mirror
      env:
        MIRROR: ${{ inputs.mirror || vars.TERMUX_MIRROR || 'default' }}
      run: python3 tools/termux-mirror.py "$MIRROR" >> "$GITHUB_OUTPUT"
    - name: Choose what to build
      id: plan
      env:
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_RELEASE: ${{ inputs.release }}
        INPUT_REBUILD: ${{ inputs.rebuild }}
        TARBALLS: ${{ inputs.tarballs || vars.REPO_TARBALLS || 'net' }}
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -f  # Package names are split into words below, and must not expand as globs.
        release=
        if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
          release=$INPUT_RELEASE
        elif test "$GITHUB_REF_TYPE" = tag; then
          release=$GITHUB_REF_NAME
        fi
        case $TARBALLS in
          net) net=true offline=false;;
          offline) net=false offline=true;;
          both) net=true offline=true;;
          *) echo "::error::tarballs must be net, offline or both, not $TARBALLS."; exit 1;;
        esac
        if test -n "$release" && test "$net" != true; then
          echo "::error::install.sh downloads a release's net tarball, so a release needs tarballs: net or both."
          exit 1
        fi
        if test -z "$INPUT_PACKAGES"; then
          requested=$(python3 tools/recipes.py plan --all)
        elif test -n "$release"; then
          # install.sh takes the latest release as complete, so a partial one would break it.
          echo "::error::A release needs every package: leave packages empty."
          exit 1
        else
          requested=$(python3 tools/recipes.py plan $INPUT_PACKAGES)
        fi
        if test "$INPUT_REBUILD" = true; then
          matrix=$requested
        else
          matrix=$(printf '%s' "$requested" | python3 tools/recipes.py unbuilt)
        fi
        artifacts=$(printf '%s' "$requested" | python3 -c 'import json,sys; print(" ".join(job["artifact"] for job in json.load(sys.stdin)["include"]))')
        count=$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')
        printf 'matrix=%s\ncount=%s\nartifacts=%s\nrelease=%s\nnet=%s\noffline=%s\n' \
          "$matrix" "$count" "$artifacts" "$release" "$net" "$offline" >> "$GITHUB_OUTPUT"
        printf 'Building %s of the requested sets: %s\n' "$count" "$matrix"

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read  # To find a set that another run built while this job waited.
    # One job at a time per set, across runs. A job that waited here for another run's build of the
    # same set finds that build's packages below and stops there.
    concurrency:
      group: packages-${{ matrix.artifact }}
      cancel-in-progress: false
    # Set per job by tools/recipes.py, which gives chromium the most GitHub allows.
    timeout-minutes: ${{ matrix.timeout }}
    env:
      TERMUX_PACKAGES_COMMIT: ${{ needs.plan.outputs.revision }}
      TERMUX_BUILDER_IMAGE_NAME: ${{ needs.plan.outputs.image }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v7
    - name: Look for this set's packages from another run
      id: earlier
      if: inputs.rebuild != true
      env:
        ARTIFACT: ${{ matrix.artifact }}
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if test -n "$(python3 tools/recipes.py artifact "$ARTIFACT")"; then
          echo "Another run already built $ARTIFACT."
          echo built=true >> "$GITHUB_OUTPUT"
        fi
    - name: Check that the patches still apply
      if: steps.earlier.outputs.built != 'true'
      env:
        PACKAGES: ${{ matrix.packages }}
      run: python3 tools/recipes.py check-patches $PACKAGES
    - uses: actions/checkout@v7
      if: steps.earlier.outputs.built != 'true'
      with:
        repository: termux/termux-packages
        ref: ${{ env.TERMUX_PACKAGES_COMMIT }}
        path: termux-packages
    - name: Add this repository's recipes
      if: steps.earlier.outputs.built != 'true'
      env:
        PACKAGES: ${{ matrix.packages }}
      run: python3 tools/recipes.py prepare termux-packages $PACKAGES
    - name: Download dependencies from the chosen Termux mirror
      if: steps.earlier.outputs.built != 'true'
      env:
        MIRROR_MAIN: ${{ needs.plan.outputs.mirror_main }}
        MIRROR_X11: ${{ needs.plan.outputs.mirror_x11 }}
      # The builder verifies each mirror's index with the pinned termux-keyring, as from its own host.
      run: |
        python3 - termux-packages/repo.json <<'EOF'
        import json, os, sys
        repos = json.load(open(sys.argv[1]))
        repos['packages']['url'] = os.environ['MIRROR_MAIN']
        repos['x11-packages']['url'] = os.environ['MIRROR_X11']
        json.dump(repos, open(sys.argv[1], 'w'), indent=2)
        EOF
    - name: Keep the builder's work directory on the runner, where it can be cached
      if: steps.earlier.outputs.built != 'true'
      run: |
        mkdir -p ~/.termux-build
        echo "TERMUX_DOCKER_RUN_EXTRA_ARGS=--volume $HOME/.termux-build:/home/builder/.termux-build" >> "$GITHUB_ENV"

    # Builder dependencies, one entry of each kind per job. Host tools differ between jobs, such as the
    # Python that Chromium's build compiles for itself, and a shared entry would hold only what the
    # first job to save it set up. A job starts only from its own earlier entries, so one job's
    # downloads never pile into another's. Not cached, as too large for the repository's 10 GB allowance
    # for what they save: the 2.5 GB compressed container image, which every job must still load, and
    # Chromium's 1.9 GB source, which downloads in seconds.
    - name: Restore the host tools
      id: tools
      if: steps.earlier.outputs.built != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.termux-build/_cache
        key: termux-host-tools-${{ env.TERMUX_PACKAGES_COMMIT }}-${{ matrix.name }}
    - name: Restore dependency packages and sources
      id: deps
      if: steps.earlier.outputs.built != 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.termux-build/_cache-aarch64
          ~/.termux-build/*/cache
          !~/.termux-build/chromium/cache/chromium-*-linux.tar.xz
        key: termux-downloads-${{ env.TERMUX_PACKAGES_COMMIT }}-${{ matrix.name }}-${{ matrix.hash }}
        restore-keys: termux-downloads-${{ env.TERMUX_PACKAGES_COMMIT }}-${{ matrix.name }}-

    - name: Start the builder container
      if: steps.earlier.outputs.built != 'true'
      working-directory: termux-packages
      run: ./scripts/run-docker.sh true
    - name: Install the build-machine libraries that recipes' own tools link
      if: steps.earlier.outputs.built != 'true' && matrix.host_packages != ''
      working-directory: termux-packages
      env:
        HOST_PACKAGES: ${{ matrix.host_packages }}
        # As root, and with apt kept from switching to its _apt user: the builder's AppArmor profile
        # denies setuid and setgid, so neither sudo nor apt's own sandbox can change user.
        TERMUX_DOCKER_EXEC_EXTRA_ARGS: --user root
      run: |
        ./scripts/run-docker.sh apt-get -o APT::Sandbox::User=root update -qq
        ./scripts/run-docker.sh env DEBIAN_FRONTEND=noninteractive \
          apt-get -o APT::Sandbox::User=root install -yqq --no-install-recommends $HOST_PACKAGES
    - name: Free disk space
      if: steps.earlier.outputs.built != 'true' && matrix.large
      working-directory: termux-packages
      run: ./scripts/free-space.sh
    - name: Build
      id: build
      if: steps.earlier.outputs.built != 'true'
      working-directory: termux-packages
      env:
        PACKAGES: ${{ matrix.packages }}
        EXACT: ${{ matrix.exact }}
      # Termux's repository keeps only each package's newest version, so a dependency held to the pinned
      # builder's version is usually gone and gets compiled instead, Node.js and Electron included.
      # -w downloads the repository's version. See EXACT_DEPENDENCIES in tools/recipes.py.
      run: |
        unbound=-w
        test "$EXACT" != true || unbound=
        ./scripts/run-docker.sh ./build-package.sh -I -C $unbound -a aarch64 $PACKAGES

    - name: Check native network package artifacts
      if: steps.build.outcome == 'success' && contains(format(' {0} ', matrix.packages), ' gvfs ')
      env:
        PACKAGES_OUTPUT: termux-packages/output
      run: python3 tests/packaging/check-network-artifacts.py "$PACKAGES_OUTPUT"

    - name: Check Nautilus against the current ICU package
      if: steps.build.outcome == 'success' && contains(format(' {0} ', matrix.packages), ' nautilus ')
      run: python3 tests/packaging/check-nautilus-artifact.py termux-packages/output

    - name: Check the Android storage provider artifact
      if: steps.build.outcome == 'success' && contains(format(' {0} ', matrix.packages), ' android-gvfs ')
      run: python3 tests/packaging/check-storage-artifact.py termux-packages/output

    - name: Check Firefox decoder ABI and Chromium libva library names
      if: steps.build.outcome == 'success' && contains(format(' {0} ', matrix.packages), ' android-firefox-video ')
      run: python3 tests/packaging/check-browser-video-artifacts.py termux-packages/output

    # Saved only after a successful build. An entry can never be replaced, so one saved by a job that
    # failed early would hold only what it restored, and later runs would keep restoring that.
    - name: Make the caches readable
      if: steps.build.outcome == 'success'
      run: sudo chown -R "$(id -u):$(id -g)" ~/.termux-build
    - name: Save the host tools
      if: steps.build.outcome == 'success' && steps.tools.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.termux-build/_cache
        key: ${{ steps.tools.outputs.cache-primary-key }}
    - name: Save dependency packages and sources
      if: steps.build.outcome == 'success' && steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.termux-build/_cache-aarch64
          ~/.termux-build/*/cache
          !~/.termux-build/chromium/cache/chromium-*-linux.tar.xz
        key: ${{ steps.deps.outputs.cache-primary-key }}

    # Kept for later runs, which take the set from here while it stays the same. 90 days is the most
    # GitHub keeps an artifact; after that the set is simply built again.
    - uses: actions/upload-artifact@v7
      if: steps.build.outcome == 'success'
      with:
        name: ${{ matrix.artifact }}
        path: termux-packages/output/*.deb
        if-no-files-found: error
        retention-days: 90

  assemble:
    # Skipped unless every set built here succeeded, so a release is never missing a package.
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.plan.outputs.count != '0' || needs.plan.outputs.release != '' || needs.plan.outputs.offline == 'true') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write  # To download the sets earlier runs built, and replace the offline packages' cache.
    env:
      OFFLINE_TARBALL: livecd-termux-repo-aarch64-offline.tar.gz
    steps:
    - uses: actions/checkout@v7
    - name: Collect every set's packages, from this run or the one that built them
      env:
        ARTIFACTS: ${{ needs.plan.outputs.artifacts }}
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        mkdir -p debs
        for artifact in $ARTIFACTS; do
          url=$(python3 tools/recipes.py artifact "$artifact")
          test -n "$url" || { echo "::error::No build of $artifact was found."; exit 1; }
          # curl does not pass the token on to the storage host the download redirects to.
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/$artifact.zip" "$url"
          unzip -oq "$RUNNER_TEMP/$artifact.zip" -d debs
        done
    - name: Check reused Nautilus against the current ICU package
      run: |
        if test -n "$(find debs -name 'nautilus_*.deb' -print -quit)"; then
          python3 tests/packaging/check-nautilus-artifact.py debs
        fi
    - name: Check reused browser video artifacts
      run: |
        if test -n "$(find debs -name 'android-firefox-video_*.deb' -print -quit)"; then
          python3 tests/packaging/check-browser-video-artifacts.py debs
        fi
    # What the pin list and the offline packages need from the pinned builder: the recipes' subpackage
    # files, its keyring and its bootstrap script.
    - uses: actions/checkout@v7
      with:
        repository: termux/termux-packages
        ref: ${{ needs.plan.outputs.revision }}
        path: termux-packages
        sparse-checkout: |
          x11-packages/*/*.subpackage.sh
          packages/termux-keyring/
          scripts/generate-bootstraps.sh
        sparse-checkout-cone-mode: false
    - name: Build the apt repository
      run: |
        command -v apt-ftparchive >/dev/null || { sudo apt-get update; sudo apt-get install --yes apt-utils; }
        tools/make-apt-repo.sh debs repo
        # install.sh pins these to suite livecd.
        python3 tools/recipes.py pins termux-packages > repo/pins
    - name: Build the net tarball
      if: needs.plan.outputs.net == 'true'
      run: |
        tar -czf "$REPO_TARBALL" repo
        sha256sum "$REPO_TARBALL" > "$REPO_TARBALL.sha256"
    - uses: actions/upload-artifact@v7
      if: needs.plan.outputs.net == 'true'
      with:
        name: livecd-termux-repo-aarch64
        path: |
          ${{ env.REPO_TARBALL }}
          ${{ env.REPO_TARBALL }}.sha256
        retention-days: 30

    # Offline: this project's packages plus every Termux package an installation can need, from
    # Termux's current repositories. tools/offline-repo.py has the rules.
    # Termux keeps each package file until it is superseded, so last run's downloads are mostly still
    # current, and apt fetches only the rest. One entry is kept: it holds about 800 MB, and the build
    # caches already take most of the repository's 10 GB.
    - name: Restore the offline packages
      id: offline-cache
      if: needs.plan.outputs.offline == 'true'
      uses: actions/cache/restore@v6
      with:
        path: offline-debs
        key: termux-offline-debs-${{ github.run_id }}
        restore-keys: termux-offline-debs-
    - name: Add every Termux dependency
      if: needs.plan.outputs.offline == 'true'
      env:
        MIRROR_MAIN: ${{ needs.plan.outputs.mirror_main }}
        MIRROR_X11: ${{ needs.plan.outputs.mirror_x11 }}
      run: |
        python3 tools/offline-repo.py --main "$MIRROR_MAIN" --x11 "$MIRROR_X11" --cache offline-debs repo termux-packages
        echo "OFFLINE_KEY=termux-offline-debs-$(ls offline-debs | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
    - name: Save the offline packages
      if: needs.plan.outputs.offline == 'true' && steps.offline-cache.outputs.cache-matched-key != env.OFFLINE_KEY
      uses: actions/cache/save@v6
      with:
        path: offline-debs
        key: ${{ env.OFFLINE_KEY }}
    - name: Drop older offline package caches
      if: needs.plan.outputs.offline == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key termux-offline-debs- --limit 100 --json id,key \
          --jq ".[] | select(.key != \"$OFFLINE_KEY\") | .id" | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
    - name: Build the offline tarball
      if: needs.plan.outputs.offline == 'true'
      # The packages are compressed already, so gzip's fastest level costs almost nothing in size.
      run: |
        tar -I 'gzip -1' -cf "$OFFLINE_TARBALL" repo
        sha256sum "$OFFLINE_TARBALL" > "$OFFLINE_TARBALL.sha256"
        ls -l "$OFFLINE_TARBALL"
    - uses: actions/upload-artifact@v7
      if: needs.plan.outputs.offline == 'true'
      with:
        name: livecd-termux-repo-aarch64-offline
        path: |
          ${{ env.OFFLINE_TARBALL }}
          ${{ env.OFFLINE_TARBALL }}.sha256
        compression-level: 0
        retention-days: 30

    - name: Attach the packages to the release draft
      if: needs.plan.outputs.release != ''
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.plan.outputs.release }}
        OFFLINE: ${{ needs.plan.outputs.offline }}
      run: |
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --draft
        files=("$REPO_TARBALL" "$REPO_TARBALL.sha256")
        if test "$OFFLINE" = true; then
          # GitHub refuses release files of 2 GiB or more. A larger tarball goes up in parts, which
          # cat joins again; its .sha256 is for the joined file.
          if test "$(stat -c %s "$OFFLINE_TARBALL")" -ge 2147483648; then
            split -b 2000M -d -a 2 "$OFFLINE_TARBALL" "$OFFLINE_TARBALL.part"
            files+=("$OFFLINE_TARBALL".part* "$OFFLINE_TARBALL.sha256")
            echo "::warning::The offline tarball is over 2 GiB, so the release has it in parts: cat $OFFLINE_TARBALL.part* > $OFFLINE_TARBALL"
          else
            files+=("$OFFLINE_TARBALL" "$OFFLINE_TARBALL.sha256")
          fi
        fi
        gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
