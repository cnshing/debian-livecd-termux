# Overlays that `install.sh` applies by default. This is Termux's counterpart to upstream's
# os/config.yaml. Opt-in overlays are named on the command line, for example:
#   bash install.sh "Music Player"
#
# Android integrations are on by default. Optional applications are packages, installed
# later with `pkg install NAME`, such as `pkg install mixtapes`.
overlays:
- Desktop Environment
- Desktop Environment+Shell
- Desktop Environment+Phone Sync
- Desktop Environment+Tweaks
- Desktop Environment+Window Tiling
- Desktop Environment+Theming
- Desktop Environment+Thumbnailers
- Terminal
- File Manager
- Text Editor
- Text Editor+Code OSS
- Image Viewer
- Video Player
- System Monitor
- Browser
- Browser+Ad blocking
- Browser+Chromium
- Audio Effects
- Microphone
- Camera
