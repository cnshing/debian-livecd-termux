name: PanVK qualification CTS executables
on:
  workflow_dispatch:
    inputs:
      target:
        description: CTS executable to build
        type: choice
        options: [both, deqp-vk, deqp-gles31]
        default: both
permissions:
  contents: read
jobs:
  cts:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'deqp-vk' && '["deqp-vk"]' || inputs.target == 'deqp-gles31' && '["deqp-gles31"]' || '["deqp-vk", "deqp-gles31"]') }}
    concurrency:
      group: panvk-cts-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: KhronosGroup/VK-GL-CTS
        # vulkan-cts-1.4.7.1
        ref: 0d18b347943e5e843529a05c95220e27fe30c538
        path: cts
    - name: Install CTS build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build python3-lxml
    - name: Build the standalone Android executable
      run: bash tools/panvk-probes/cts/build.sh cts '${{ matrix.target }}' out
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: panvk-cts-${{ matrix.target }}-android-aarch64
        path: |
          out/
          cts/build-*/CMakeCache.txt
          cts/build-*/CMakeFiles/CMakeConfigureLog.yaml
        if-no-files-found: error
