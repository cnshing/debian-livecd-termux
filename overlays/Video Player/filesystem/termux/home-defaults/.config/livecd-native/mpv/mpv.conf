# Validated software path on the Note10+ / Termux:X11 rig.
# mpv rejects llvmpipe with its default GPU policy; explicit GPU rendering
# was slower in the short clip probe. Android handles physical output devices.
vo=x11
# Temporary workaround for PulseAudio/OpenSL ES playback timing on Android.
# Return to PulseAudio after docs/native/handoff/mpv-audio-timing.md is resolved.
ao=aaudio
hwdec=no
