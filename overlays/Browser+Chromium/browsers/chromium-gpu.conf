# Sourced by chromium-browser. Vulkan through Turnip, the driver the native desktop uses.
# On a Mutter without the fullscreen fix, GPU rendering reliably crashes GNOME Shell when
# a window leaves fullscreen, so this waits for the runtime's receipt to list that fix.
# LIVECD_CHROMIUM_GPU=0 or 1 overrides the check.
if [ -f "$HOME/.local/lib/livecd-native/acceleration.py" ]; then
    # The common helper emits quoted exports, preserving Chromium's upstream
    # config-file loading and CHROMIUM_USER_FLAGS precedence.
    livecd_exports=$(CHROMIUM_FLAGS="${CHROMIUM_FLAGS-}" /data/data/com.termux/files/usr/bin/python \
        "$HOME/.local/lib/livecd-native/acceleration.py" chromium-env) || return 1
    eval "$livecd_exports"
    unset livecd_exports
    return 0
fi
livecd_gpu=$HOME/.local/opt/livecd-native/gpu/share/vulkan/icd.d/freedreno_icd.aarch64.json
livecd_receipt=$HOME/.local/opt/livecd-native/gnome-48/share/doc/mutter/build-source.json
case ${LIVECD_CHROMIUM_GPU:-auto} in
    0) livecd_enable= ;;
    1) livecd_enable=1 ;;
    *) grep -q 0010-clip-pixmap-damage "$livecd_receipt" 2>/dev/null && livecd_enable=1 || livecd_enable= ;;
esac
if [ -n "$livecd_enable" ] && [ -f "$livecd_gpu" ]; then
    export VK_DRIVER_FILES="$livecd_gpu" VK_ICD_FILENAMES="$livecd_gpu"
    CHROMIUM_FLAGS="$CHROMIUM_FLAGS --use-gl=angle --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist"
fi
unset livecd_gpu livecd_receipt livecd_enable
